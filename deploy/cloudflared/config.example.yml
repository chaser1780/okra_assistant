# Copy to /etc/cloudflared/config.yml after creating the tunnel.
tunnel: replace-with-tunnel-uuid
credentials-file: /etc/cloudflared/replace-with-tunnel-uuid.json

ingress:
  - hostname: okra.example.com
    service: http://127.0.0.1:8080
    originRequest:
      httpHostHeader: okra.example.com
  - service: http_status:404
