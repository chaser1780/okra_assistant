[project]
name = "okra-assistant"
display_name = "OKRA Assistant"
version = "0.2.0"
status = "local-production"
created_at = "2026-03-10"
owner = "qmq"
language = "zh-CN"
platform = "windows-local"
entry_desktop = "F:\\okra_assistant\\run_desktop_app.ps1"
entry_api = "F:\\okra_assistant\\app\\web_api.py"
entry_today_analysis = "F:\\okra_assistant\\scripts\\run_today_analysis.py"
entry_long_memory = "F:\\okra_assistant\\scripts\\run_long_memory_analysis.py"
entry_frontend_routes = "F:\\okra_assistant\\frontend\\src\\app\\routes.tsx"

[paths]
project_root = "F:\\okra_assistant"
desktop_shortcut = ""
desktop_launcher = "F:\\okra_assistant\\run_desktop_app.ps1"
backup_dir = "F:\\okra_assistant\\backups"

[runtime]
python_executable = ""

[features]
multiagent = true
desktop_shell = true
portfolio_autoupdate = true
night_review = true
realtime_estimate = true
intraday_proxy = true

[backup]
exclude_cache = true
exclude_temp = true
exclude_logs = false
compress_format = "zip"
