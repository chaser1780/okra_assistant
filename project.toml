[project]
name = "okra-assistant"
display_name = "OKRA Assistant"
version = "0.2.0"
status = "local-production"
created_at = "2026-03-10"
owner = "qmq"
language = "zh-CN"
platform = "local"
entry_desktop = "run_desktop_app.ps1"
entry_api = "app/web_api.py"
entry_today_analysis = "scripts/run_today_analysis.py"
entry_long_memory = "scripts/run_long_memory_analysis.py"
entry_frontend_routes = "frontend/src/app/routes.tsx"

[paths]
project_root = "."
desktop_shortcut = ""
desktop_launcher = "run_desktop_app.ps1"
backup_dir = "backups"

[runtime]
python_executable = ""

[features]
multiagent = true
desktop_shell = true
portfolio_autoupdate = true
night_review = true
realtime_estimate = true
intraday_proxy = true

[backup]
exclude_cache = true
exclude_temp = true
exclude_logs = false
compress_format = "zip"
